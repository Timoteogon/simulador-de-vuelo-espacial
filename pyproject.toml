[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-de-vuelo-espacial"
version = "12.13.12"
description = "Simulador de trayectorias de cohetes de dos etapas en Python (ascenso, órbita, TLI, escape, desórbita y vuelo lunar)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mateo Chavarria Gonzalez" }]
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "astropy>=8.0.1",
    "spiceypy>=8.2.0",
    "pymcel>=0.9.25",
    "rebound>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
